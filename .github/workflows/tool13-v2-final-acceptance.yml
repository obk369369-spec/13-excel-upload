name: TOOL013 V2 Final Acceptance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool13-v2-final-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare approved translation and close TOOL013 V2
        run: python scripts/tool13_v2_translation_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: tool13-v2-final-acceptance
          path: |
            evidence/tool13_v2_translation_acceptance.json
            evidence/tool13_v2_actual_template_e2e.json
            tool13_v2/OPERATIONS_READY.json
      - name: Persist final remote evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/tool13_v2_translation_acceptance.json tool13_v2/OPERATIONS_READY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool13: persist V2 final acceptance evidence'
          git pull --rebase origin main
          git push origin HEAD:main
