name: TOOL013 Translation and Matching Candidate Canary

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool13-translation-matching-candidate
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified free candidate
        run: python -m pip install 'argostranslate==1.10.0'
      - name: Execute actual TOOL013 title and matching canary
        run: python scripts/tool13_translation_matching_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: tool13-translation-matching-candidate
          path: evidence/tool13_translation_matching_candidate.json
      - name: Persist remote evidence without changing stable runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/tool13_translation_matching_candidate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool13: persist translation and matching candidate canary'
          git pull --rebase origin main
          git push origin HEAD:main
